name: Smoke
on:
  pull_request:
    paths:
      - 'packages/**'
      - 'templates/**'
      - 'scripts/smoke-npm.mjs'
      - '.github/workflows/smoke.yml'
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke:npm
