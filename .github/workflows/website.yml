name: Website
# Deploys kitcms.dev (apps/website, Decision 38). The site runs the workspace packages, so a
# change to packages/** redeploys it too. Migrations are generated locally and committed; CI only
# applies them.
on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/website.yml'
  workflow_dispatch:

concurrency:
  group: website-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter website typecheck
      - run: pnpm --filter website build
      - name: Apply D1 migrations
        run: pnpm --filter website db:migrate:remote
      - name: Deploy
        run: pnpm --filter website exec wrangler deploy
